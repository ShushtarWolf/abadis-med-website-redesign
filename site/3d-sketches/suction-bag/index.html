<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>اسکچ سه‌بعدی کیسه ساکشن ۱ لیتری آبادیس</title>
  <meta name="description" content="نمایشگر سه‌بعدی کیسه ساکشن یکبار مصرف ۱ لیتری آبادیس. مطالعهٔ فرم؛ ابعاد از نقشهٔ محصول: قطر ۱۱ و ارتفاع ۱۵٫۵ سانتی‌متر.">
  <script type="importmap">
  {
    "imports": {
      "three": "../../assets/vendor/three/build/three.module.js",
      "three/addons/": "../../assets/vendor/three/examples/jsm/"
    }
  }
  </script>
  <style>
    @font-face { font-family: "Kalameh"; src: url("../../assets/fonts/kalameh/KalamehWeb-FaNum-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Kalameh"; src: url("../../assets/fonts/kalameh/KalamehWeb-FaNum-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Kalameh"; src: url("../../assets/fonts/kalameh/KalamehWeb-FaNum-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Kalameh"; src: url("../../assets/fonts/kalameh/KalamehWeb-FaNum-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    :root, [data-theme="light"] {
      --bg: #f3fafa; --surface: #ffffff; --ink: #0a2e32; --ink-2: #2f4e51; --muted: #4e686b;
      --line: rgba(6,97,99,.16); --brand: #066163; --accent: #087673;
      --chip: #e8f3f3; --shadow: 0 10px 28px rgba(11,46,50,.08);
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #061719; --surface: #0c2427; --ink: #e8f3f3; --ink-2: #c9dfe0; --muted: #9fbcbe;
      --line: rgba(127,220,221,.18); --brand: #5fd0d1; --accent: #2ec4c6;
      --chip: rgba(46,196,198,.12); --shadow: 0 12px 30px rgba(0,0,0,.35);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Kalameh", Tahoma, sans-serif; font-size: 16px; line-height: 1.7;
      letter-spacing: 0; display: grid; grid-template-rows: auto minmax(420px, 1fr) auto;
      min-height: 100%;
    }
    header, .dock { padding: 14px 18px; }
    header {
      display: flex; justify-content: space-between; gap: 16px; align-items: flex-end;
      border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 88%, transparent);
    }
    .eyebrow { margin: 0; color: var(--brand); font-weight: 600; font-size: 13px; line-height: 1.6; }
    h1 { margin: 0; font-size: 22px; line-height: 1.35; font-weight: 700; }
    .sub { margin: 2px 0 0; color: var(--ink-2); font-size: 14px; line-height: 1.7; }
    .themes { display: flex; gap: 6px; background: var(--chip); padding: 4px; border-radius: 999px; }
    .themes button, .dock button, .presets button {
      font: inherit; font-size: 14px; font-weight: 600; line-height: 1.4;
      color: var(--ink); background: transparent; border: 1px solid transparent;
      border-radius: 999px; padding: 7px 12px; cursor: pointer;
    }
    .themes button[aria-pressed="true"] { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
    .stage { position: relative; min-height: 420px; touch-action: none; }
    canvas { width: 100%; height: 100%; display: block; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .tag {
      position: absolute; left: 0; top: 0; transform: translate(-50%, -130%);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px 5px;
      box-shadow: var(--shadow); min-width: 96px;
    }
    .tag .fa { display: block; font-size: 13px; font-weight: 700; line-height: 1.45; }
    .tag .en { display: block; font-size: 11px; color: var(--muted); line-height: 1.4; font-weight: 500; }
    .dock {
      display: grid; gap: 10px; border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .presets button, .dock .row > button {
      background: var(--chip); border-color: var(--line);
    }
    .dock button[aria-pressed="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
    .slider { display: flex; align-items: center; gap: 10px; min-width: min(100%, 340px); flex: 1; }
    .slider input { flex: 1; accent-color: #087673; }
    .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 720px) {
      h1 { font-size: 18px; }
      header { flex-direction: column; align-items: stretch; }
      .themes { align-self: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">آبادیس مد · مطالعهٔ فرم سه‌بعدی</p>
      <h1>کیسه ساکشن یکبار مصرف ۱ لیتری</h1>
      <p class="sub">قطر ۱۱ سانتی‌متر · ارتفاع ۱۵٫۵ سانتی‌متر · پودر ژل‌کننده و فیلتر هیدروفوبیک</p>
    </div>
    <div class="themes" role="group" aria-label="زمینه">
      <button type="button" data-theme-set="light" aria-pressed="true">روشن</button>
      <button type="button" data-theme-set="dark" aria-pressed="false">تیره</button>
    </div>
  </header>
  <div class="stage">
    <canvas id="view" aria-label="نمای سه‌بعدی کیسه ساکشن یکبار مصرف ۱ لیتری آبادیس. برای چرخاندن بکشید و برای بزرگ‌نمایی اسکرول کنید."></canvas>
    <div id="labels" hidden></div>
  </div>
  <div class="dock">
    <div class="row">
      <div class="presets" role="group" aria-label="نماها">
        <button type="button" data-preset="side">نمای جانبی</button>
        <button type="button" data-preset="three">سه‌ربع</button>
        <button type="button" data-preset="top">نمای بالا</button>
      </div>
      <button type="button" id="wire" data-on="0" aria-pressed="false">خطوط فنی</button>
      <button type="button" id="cut" data-on="0" aria-pressed="false">برش</button>
      <button type="button" id="labels-toggle" aria-pressed="false">برچسب‌ها</button>
      <button type="button" id="reset">بازنشانی</button>
    </div>
    <div class="row">
      <label class="slider" for="explode">نمای انفجاری
        <input id="explode" type="range" min="0" max="100" value="0" step="1">
        <span id="explode-out">۰٪</span>
      </label>
    </div>
    <p class="hint">بکشید برای چرخش · اسکرول برای بزرگ‌نمایی · ابعاد از نقشهٔ محصول، بدون تغییر صفحهٔ زنده</p>
  </div>
  <script type="module" src="./js/viewer.js"></script>
</body>
</html>
