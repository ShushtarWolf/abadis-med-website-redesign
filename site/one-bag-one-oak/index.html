<!DOCTYPE html>
<html lang="fa-IR" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>یک کیسه، یک بلوط — مخازن طبی آبادیس</title>
<meta name="description" content="بازی آرام تعویض کیسه ساکشن: هر تعویض تمیز یک بلوط روی زاگرس.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e8f3f3">
<meta property="og:title" content="یک کیسه، یک بلوط">
<meta property="og:description" content="هر تعویض تمیز، یک بلوط روی زاگرس.">
<meta property="og:image" content="../zagros-names/shared/img/hero/bg-dry-1280.webp">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/kalameh/KalamehWeb-FaNum-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/kalameh/KalamehWeb-FaNum-Black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" as="image" href="../zagros-names/shared/img/hero/bg-dry-1280.webp" type="image/webp">
<link rel="preload" as="image" href="assets/abadis-bag.webp" type="image/webp">
<link rel="stylesheet" href="game.css">
<script>
(function () {
  var t, lang;
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('theme')) localStorage.setItem('abadis-theme', q.get('theme'));
    if (q.get('lang')) localStorage.setItem('abadis-oak-lang', q.get('lang'));
    t = localStorage.getItem('abadis-theme');
    lang = localStorage.getItem('abadis-oak-lang');
  } catch (e) {}
  var d = document.documentElement;
  d.dataset.theme = (t === 'dark' || t === 'noir') ? t : 'light';
  var map = { fa: ['fa-IR', 'rtl'], en: ['en', 'ltr'], ar: ['ar', 'rtl'] };
  var pair = map[lang] || map.fa;
  d.lang = pair[0];
  d.dir = pair[1];
})();
</script>
</head>
<body>
<a class="skip" href="#stage">پرش به بازی</a>
<div id="app" class="app" data-phase="title">
  <canvas id="view" aria-hidden="true"></canvas>
  <header class="top" id="header">
    <a class="logo" href="../" id="logoLink">
      <img class="lg-light" src="../assets/img/abadis-logo-teal.png" width="658" height="309" alt="">
      <img class="lg-dark" src="../assets/img/abadis-logo-on-teal.png" width="670" height="309" alt="">
    </a>
    <p class="wordmark" id="wordmark"></p>
    <span class="spacer"></span>
    <button class="icon-btn" id="shareBtn" type="button" aria-label="share">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 16V5m0 0 3.5 3.5M12 5 8.5 8.5M5 13.5V19h14v-5.5"/></svg>
    </button>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="sound">
      <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.2h3.1L11 5.8v12.4l-3.9-3.4H4a1 1 0 0 1-1-1V10.2a1 1 0 0 1 1-1z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M14.2 9.3a3 3 0 0 1 0 5.4M16.5 7.2a5.6 5.6 0 0 1 0 9.6"/></svg>
      <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9.2h3.1L11 5.8v12.4l-3.9-3.4H4a1 1 0 0 1-1-1V10.2a1 1 0 0 1 1-1z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M15 9.5l5 5M20 9.5l-5 5"/></svg>
    </button>
    <button class="icon-btn" id="helpBtn" type="button" aria-label="help">?</button>
    <nav class="lang-switch" aria-label="language">
      <button class="lang-link" type="button" data-lang="fa" id="lang-fa">FA</button>
      <button class="lang-link" type="button" data-lang="en" id="lang-en">EN</button>
      <button class="lang-link" type="button" data-lang="ar" id="lang-ar">AR</button>
    </nav>
    <button class="theme-toggle" id="themeBtn" type="button">
      <svg class="tt-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <mask id="oak-tt-mask"><rect width="24" height="24" fill="#fff"/><circle class="tt-bite" cx="16.6" cy="7.4" r="6.3" fill="#000"/></mask>
        <g class="tt-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.6v2.2M12 20.2v2.2M1.6 12h2.2M20.2 12h2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></g>
        <circle class="tt-body" cx="12" cy="12" r="8" fill="currentColor" mask="url(#oak-tt-mask)"/>
        <g class="tt-stars" fill="currentColor"><path d="M18.3 6.1l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/><path d="M21.4 1.9l.4 1 1 .4-1 .4-.4 1-.4-1-1-.4 1-.4z"/></g>
      </svg>
    </button>
  </header>

  <p class="season" id="season"></p>
  <p class="hint" id="hint" hidden></p>
  <div class="case-chip" id="caseChip" hidden><img alt="" width="644" height="860" src="assets/abadis-bag.webp"><span id="caseText"></span></div>
  <div class="hand" id="hand" hidden aria-hidden="true"><div class="hand-bob">
    <svg viewBox="0 0 64 64"><path fill="#f4fbfb" stroke="#043e42" stroke-width="2.2" stroke-linejoin="round" d="M14 30h14V16c0-2.4 3.2-3.6 5.2-1.6l.6 1.2 7.2 14.2 3.6 3.4c2.6 3.2.6 8.2-3.4 8.8l-16 3.2c-5.2.8-10.2-2.2-11.6-7.2l-3.4-9.2c-.8-2.6 1-5.2 3.8-5.2z"/></svg>
  </div></div>

  <div class="hud" id="hud">
    <div class="pill" id="pillWater"><span class="tank" aria-hidden="true"><i id="tankFill"></i></span><span class="txt"><span class="k" id="labWater"></span><b id="numWater">0</b></span></div>
    <div class="pill" id="pillStaff"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 7.5V12l3 2"/></svg></span><span class="txt"><span class="k" id="labStaff"></span><b id="numStaff">0</b></span></div>
    <div class="pill" id="pillChem" hidden><span class="txt"><span class="k" id="labChem"></span><b id="numChem">—</b></span></div>
    <div class="pill" id="pillMoney"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="txt"><span class="k" id="labMoney"></span><b id="numMoney">0</b></span></div>
    <button class="pill seed-pill" id="shopBtn" type="button"></button>
  </div>

  <div id="stage" class="stage">
    <div class="panel" id="titleCard">
      <img class="panel-logo" src="../assets/img/abadis-logo-teal.png" width="658" height="309" alt="">
      <p class="eyebrow" id="tagline"></p>
      <h1 id="heroTitle"></h1>
      <p class="lead" id="lead"></p>
      <p class="night-line" id="nightLine" hidden></p>
      <p class="have" id="haveTrees" hidden></p>
      <button class="btn" id="start" type="button"></button>
    </div>
  </div>
</div>

<div class="modal" id="shop" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <h2 id="shopTitle"></h2>
    <p id="shopSeeds"></p>
    <button class="btn up" type="button" data-up="second"><span id="upSecond"></span><b id="costSecond"></b></button>
    <button class="btn up" type="button" data-up="sealer"><span id="upSealer"></span><b id="costSealer"></b></button>
    <button class="btn up" type="button" data-up="lamp"><span id="upLamp"></span><b id="costLamp"></b></button>
    <button class="btn up" type="button" data-up="wildlife"><span id="upWild"></span><b id="costWild"></b></button>
    <div class="row">
      <button class="btn btn-ghost" id="shopClose" type="button"></button>
      <button class="btn btn-ghost" id="resetBtn" type="button"></button>
    </div>
  </div>
</div>

<div class="modal" id="milestone" hidden>
  <div class="card ms-card" role="dialog" aria-modal="true" aria-labelledby="msKicker">
    <div class="tags" id="msTags"></div>
    <p class="eyebrow" id="msKicker"></p>
    <p class="big" id="msLitres"></p>
    <p class="unit" id="msLitreLabel"></p>
    <p class="ms-row"><span id="msStaffK"></span><b id="msStaff"></b></p>
    <p class="ms-row"><span id="msMoneyK"></span><b id="msMoney"></b></p>
    <p class="ph-line" id="msChem" hidden></p>
    <div class="row">
      <a class="btn" id="msCalc" target="_blank" rel="noopener noreferrer"></a>
      <a class="btn btn-ghost" id="msZagros" target="_blank" rel="noopener noreferrer"></a>
    </div>
    <button class="btn btn-ghost" id="msClose" type="button"></button>
    <p class="note" id="msNote"></p>
  </div>
</div>

<div id="toast" role="status"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<noscript><p>یک کیسه، یک بلوط</p></noscript>
<script src="game.js"></script>
</body>
</html>
