<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>محاسبه‌گر آبادیس+ — دایال دایره‌ای</title>
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
  <link rel="preload" href="../fonts/KalamehWeb-FaNum-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../fonts/KalamehWeb-FaNum-Bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../fonts/KalamehWeb-FaNum-Black.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: "Kalameh"; src: url("../fonts/KalamehWeb-FaNum-Regular.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
    @font-face { font-family: "Kalameh"; src: url("../fonts/KalamehWeb-FaNum-Bold.woff2") format("woff2"); font-weight: 700 800; font-display: swap; }
    @font-face { font-family: "Kalameh"; src: url("../fonts/KalamehWeb-FaNum-Black.woff2") format("woff2"); font-weight: 900; font-display: swap; }

    :root {
      --bg: #0d1117;
      --bg2: #12181f;
      --cyan: #2ee6e8;
      --cyan-dim: rgba(46,230,232,0.35);
      --ink: #f0f6fa;
      --muted: #8a9bab;
      --card: rgba(22, 30, 40, 0.72);
      --card-border: rgba(46,230,232,0.18);
      --font: "Kalameh", Tahoma, system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      background:
        radial-gradient(ellipse 80% 50% at 50% 40%, rgba(20, 60, 70, 0.35), transparent 70%),
        var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 16px 28px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 0 12px;
      direction: ltr;
    }
    .sales-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,0.55);
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .sales-btn svg { width: 16px; height: 16px; }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
      text-align: left;
    }
    .pillars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 28px;
    }
    .pillars span {
      width: 7px;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(180deg, #5ef0f2, #1a8a9a);
    }
    .pillars span:nth-child(1) { height: 16px; opacity: 0.7; }
    .pillars span:nth-child(2) { height: 28px; }
    .pillars span:nth-child(3) { height: 22px; opacity: 0.85; }
    .logo-text strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .logo-text small {
      display: block;
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 600;
      margin-top: 1px;
    }

    /* Stage: dial + side cards */
    .stage {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr minmax(220px, 340px) 1fr;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "tl dial tr"
        "bl dial br";
      gap: 12px 14px;
      align-items: center;
      min-height: 0;
      padding: 8px 0;
    }

    .dial-col {
      grid-area: dial;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      justify-content: center;
    }

    .dial-wrap {
      position: relative;
      width: min(300px, 70vw);
      aspect-ratio: 1;
    }

    .preset {
      position: absolute;
      text-align: center;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--ink);
      font-family: inherit;
      z-index: 3;
      padding: 4px;
      transition: color .2s, transform .15s;
    }
    .preset:hover { color: var(--cyan); transform: scale(1.06); }
    .preset .num { display: block; font-size: 0.78rem; font-weight: 800; line-height: 1.2; }
    .preset .unit { display: block; font-size: 0.62rem; color: var(--muted); font-weight: 600; }
    /* angles roughly matching mockup */
    .preset.p-1 { top: 8%; left: 4%; }      /* 30000 ~ 10 o'clock */
    .preset.p-2 { top: -2%; left: 50%; transform: translateX(-50%); } /* 15000 top */
    .preset.p-2:hover { transform: translateX(-50%) scale(1.06); }
    .preset.p-3 { top: 14%; right: 0%; }    /* 10000 ~ 2 o'clock */
    .preset.p-4 { bottom: 18%; right: 2%; } /* 5000 ~ 4 o'clock */
    .preset.p-5 { bottom: 22%; left: 2%; }  /* 1000 ~ 8 o'clock */

    .dial {
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 40% 35%, #1a2430 0%, #0a0e14 70%);
      box-shadow:
        0 0 0 1px rgba(46,230,232,0.12),
        0 20px 50px rgba(0,0,0,0.55),
        inset 0 2px 20px rgba(0,0,0,0.5);
      cursor: grab;
      touch-action: none;
      display: grid;
      place-items: center;
    }
    .dial:active { cursor: grabbing; }

    .dial-ring {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      pointer-events: none;
    }

    .pointer {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 12px solid #fff;
      z-index: 4;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.5));
      pointer-events: none;
    }

    .dial-logo {
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      font-weight: 900;
      color: var(--cyan);
      text-shadow: 0 0 24px rgba(46,230,232,0.65), 0 0 48px rgba(46,230,232,0.3);
      letter-spacing: -0.02em;
      pointer-events: none;
      line-height: 1;
      direction: rtl;
      unicode-bidi: isolate;
    }

    .caption {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .caption .chev {
      color: var(--cyan);
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Glass cards */
    .gcard {
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
      min-width: 0;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    .gcard.tl { grid-area: tl; }
    .gcard.tr { grid-area: tr; }
    .gcard.bl { grid-area: bl; }
    .gcard.br { grid-area: br; }

    .gcard-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: rgba(46,230,232,0.1);
      display: grid;
      place-items: center;
      color: var(--cyan);
      margin-bottom: 2px;
    }
    .gcard-icon svg { width: 18px; height: 18px; }
    .gcard-title {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.4;
    }
    .gcard-value {
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      font-weight: 900;
      color: var(--ink);
      direction: ltr;
      unicode-bidi: plaintext;
      letter-spacing: -0.02em;
    }
    .gcard-sub {
      font-size: 0.68rem;
      color: var(--muted);
      font-weight: 600;
    }
    .gcard-bar {
      margin-top: 8px;
      height: 3px;
      border-radius: 2px;
      background: rgba(46,230,232,0.12);
      overflow: hidden;
    }
    .gcard-bar > i {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
      border-radius: 2px;
      box-shadow: 0 0 8px var(--cyan);
      transition: width .35s ease;
    }

    @media (max-width: 720px) {
      .stage {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto auto;
        grid-template-areas:
          "dial dial"
          "tr tl"
          "br bl";
        gap: 10px;
      }
      .dial-wrap { width: min(260px, 78vw); }
      .gcard { padding: 12px 10px 10px; }
      .gcard-value { font-size: 0.95rem; }
      }
    @media (max-width: 400px) {
      .sales-btn { padding: 8px 12px; font-size: 0.72rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="sales-btn" href="tel:+980000000000">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        تماس با فروش
      </a>
      <a class="logo" href="#" aria-label="Abadis Med">
        <div class="pillars" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="logo-text">
          <strong>Abadis Med</strong>
          <small>راهکارهای هوشمند پزشکی</small>
        </div>
      </a>
    </header>

    <div class="stage">
      <article class="gcard tl">
        <div class="gcard-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
        </div>
        <div class="gcard-title">پس انداز کل</div>
        <div class="gcard-value" id="vTotal">۰ تومان</div>
        <div class="gcard-sub">معادل ریالی</div>
        <div class="gcard-bar"><i id="barTotal"></i></div>
      </article>

      <article class="gcard tr">
        <div class="gcard-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        </div>
        <div class="gcard-title">پس انداز به ازای هر تخت</div>
        <div class="gcard-value" id="vPerBed">۰ تومان</div>
        <div class="gcard-sub">سالانه</div>
        <div class="gcard-bar"><i id="barPerBed"></i></div>
      </article>

      <div class="dial-col">
        <div class="dial-wrap" id="dialWrap">
          <button type="button" class="preset p-1" data-value="30000"><span class="num">۳۰۰۰۰</span><span class="unit">تخت</span></button>
          <button type="button" class="preset p-2" data-value="15000"><span class="num">۱۵۰۰۰</span><span class="unit">تخت</span></button>
          <button type="button" class="preset p-3" data-value="10000"><span class="num">۱۰۰۰۰</span><span class="unit">تخت</span></button>
          <button type="button" class="preset p-4" data-value="5000"><span class="num">۵۰۰۰</span><span class="unit">تخت</span></button>
          <button type="button" class="preset p-5" data-value="1000"><span class="num">۱۰۰۰</span><span class="unit">تخت</span></button>
          <div class="pointer" aria-hidden="true"></div>
          <svg class="dial-ring" viewBox="0 0 220 220" aria-hidden="true">
            <defs>
              <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#1a8a9a"/>
                <stop offset="100%" stop-color="#2ee6e8"/>
              </linearGradient>
            </defs>
            <circle cx="110" cy="110" r="100" fill="none" stroke="rgba(46,230,232,0.08)" stroke-width="6"/>
            <circle id="progressArc" cx="110" cy="110" r="100" fill="none" stroke="url(#arcGrad)" stroke-width="6"
              stroke-linecap="round" stroke-dasharray="628.3" stroke-dashoffset="628.3"
              transform="rotate(-90 110 110)"
              style="filter: drop-shadow(0 0 6px rgba(46,230,232,0.7)); transition: stroke-dashoffset .25s ease;"/>
          </svg>
          <div class="dial" id="dial" role="slider" aria-valuemin="1000" aria-valuemax="30000" aria-valuenow="0" aria-label="تعداد تخت">
            <span class="dial-logo">آبادیس+</span>
          </div>
        </div>
        <p class="caption"><span class="chev">&lt;</span> تعداد تخت را بچرخانید <span class="chev">&gt;</span></p>
      </div>

      <article class="gcard bl">
        <div class="gcard-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </div>
        <div class="gcard-title">صرفه جویی سالانه تخمینی</div>
        <div class="gcard-value" id="vAnnual">۰ تومان</div>
        <div class="gcard-sub">در سال</div>
        <div class="gcard-bar"><i id="barAnnual"></i></div>
      </article>

      <article class="gcard br">
        <div class="gcard-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
        </div>
        <div class="gcard-title">بازگشت سرمایه</div>
        <div class="gcard-value" id="vRoi">۰ ٪</div>
        <div class="gcard-sub">تخمینی</div>
        <div class="gcard-bar"><i id="barRoi"></i></div>
      </article>
    </div>
  </div>

  <script>
(function () {
  var MIN = 1000, MAX = 30000, STEP = 100;
  var PER_BED_YEAR = 2600; // annual Toman per bed (demo)
  var beds = 0;
  var interacted = false;
  var CIRC = 2 * Math.PI * 100; // ~628.3

  var dial = document.getElementById('dial');
  var arc = document.getElementById('progressArc');

  function fa(n) { return Math.round(n).toLocaleString('fa-IR'); }

  function angleFromValue(v) {
    var t = (v - MIN) / (MAX - MIN);
    return t * 360; // full circle for rotation feel; arc uses t
  }

  function valueFromPointer(clientX, clientY) {
    var rect = dial.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var rad = Math.atan2(clientY - cy, clientX - cx);
    // 0 at top, clockwise positive mapped to value
    var deg = (rad * 180 / Math.PI + 90 + 360) % 360;
    var t = deg / 360;
    var v = MIN + t * (MAX - MIN);
    return Math.round(v / STEP) * STEP;
  }

  function updateUI() {
    var annual = interacted ? beds * PER_BED_YEAR : 0;
    var total = annual * 3;
    var perBed = interacted && beds ? PER_BED_YEAR : 0;
    var roi = interacted ? Math.min(92, Math.round(18 + (beds - MIN) / (MAX - MIN) * 70)) : 0;

    document.getElementById('vTotal').textContent = fa(total) + ' تومان';
    document.getElementById('vAnnual').textContent = fa(annual) + ' تومان';
    document.getElementById('vPerBed').textContent = fa(perBed) + ' تومان';
    document.getElementById('vRoi').textContent = fa(roi) + ' ٪';

    var t = interacted ? (beds - MIN) / (MAX - MIN) : 0;
    arc.style.strokeDashoffset = String(CIRC * (1 - t));
    document.getElementById('barTotal').style.width = (t * 100) + '%';
    document.getElementById('barAnnual').style.width = (t * 100) + '%';
    document.getElementById('barPerBed').style.width = (t * 85 + 15) + '%';
    document.getElementById('barRoi').style.width = roi + '%';

    dial.setAttribute('aria-valuenow', beds);
    // subtle rotate of dial body for feedback
    dial.style.transform = interacted ? 'rotate(' + (t * 270 - 135) + 'deg)' : 'none';
    // keep logo upright
    dial.querySelector('.dial-logo').style.transform = interacted ? 'rotate(' + (-(t * 270 - 135)) + 'deg)' : 'none';
  }

  function setBeds(v, fromUser) {
    if (fromUser) interacted = true;
    beds = Math.max(MIN, Math.min(MAX, v));
    updateUI();
  }

  var dragging = false;
  function onDown(e) {
    dragging = true;
    if (dial.setPointerCapture && e.pointerId != null) try { dial.setPointerCapture(e.pointerId); } catch (_) {}
    var x = e.clientX != null ? e.clientX : e.touches[0].clientX;
    var y = e.clientY != null ? e.clientY : e.touches[0].clientY;
    setBeds(valueFromPointer(x, y), true);
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var x = e.clientX != null ? e.clientX : (e.touches && e.touches[0] && e.touches[0].clientX);
    var y = e.clientY != null ? e.clientY : (e.touches && e.touches[0] && e.touches[0].clientY);
    if (x == null) return;
    setBeds(valueFromPointer(x, y), true);
    e.preventDefault();
  }
  function onUp() { dragging = false; }

  dial.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  dial.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  document.querySelectorAll('.preset').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setBeds(+btn.getAttribute('data-value'), true);
    });
  });

  updateUI();
})();
  </script>
</body>
</html>
